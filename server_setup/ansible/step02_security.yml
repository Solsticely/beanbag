  # Auditd setup
  - name: Install nextron audit config
    ansible.builtin.get_url:
      url: https://raw.githubusercontent.com/Neo23x0/auditd/master/audit.rules
      dest: /etc/audit/rules.d/audit.rules

  - name: Update audit rules
    command: augenrules --load

  - name: Restart auditd
    systemd: {name: auditd, state: restarted}

  # Improve file permissions
  - name: Change permissions for /boot/grub/grub.cfg
    file: {dest: /boot/grub/grub.cfg, mode: '600'}
  - name: Change permissions for /etc/ssh/sshd_config
    file: {dest: /etc/ssh/sshd_config, mode: '600'}
  - name: Change permissions for /etc/cron.d
    file: {dest: /etc/cron.d, mode: '700'}
  - name: Change permissions for /etc/crontab
    file: {dest: /etc/crontab, mode: '600'}
  - name: Change permissions for /etc/cron.daily
    file: {dest: /etc/cron.daily, mode: '700'}
  - name: Change permissions for /etc/cron.hourly
    file: {dest: /etc/cron.hourly, mode: '700'}
  - name: Change permissions for /etc/cron.weekly
    file: {dest: /etc/cron.weekly, mode: '700'}
  - name: Change permissions for /etc/cron.monthly
    file: {dest: /etc/cron.monthly, mode: '700'}
  
