[service]
name="FrankenPHP"
id="caddy"

[storage]
datafiles = ["Caddyfile"]

[provision]
commands = [
  { download_github_artifact = [
    "dunglas/frankenphp",
    ["frankenphp-linux-", { get = "arch" }, "-gnu"],
    "./caddy"
  ] },
  { sh = "chmod +x ./caddy" }
]

[kill]
commands = { exec = ["./caddy", "stop"] }

[run]
on_exit = "retry"
commands = { exec = ["authbind", "./caddy", "run"] }

[update]
type = "reprovision"
get_version = { sh = "caddy --version" }
kill_before = true

